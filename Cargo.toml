[package]
name = "telegram_music_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros", "sqlite-storage"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
lru = "0.12"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
async-trait = "0.1"
futures = "0.3.34"
